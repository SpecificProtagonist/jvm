[package]
name = "jvm"
version = "0.1.0"
authors = ["SpecificProtagonist <specificprotagonist@posteo.net>"]
edition = "2021"

[lib]
bench = false

[features]
# Internal
miri_debug_print = []

[dependencies]
# AccessFlags
bitflags = "1.3"
# Storage with JVM lifetime; to be removed later
fixed-typed-arena = "0.2"
# Lookups with borrowed key
hashbrown = "0.14"
# Stack exhaustion check
stacker = "0.1"
cesu8 = "1.1"
atomic-wait = "1.1"

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies.libc]
version = "0.2"

[dev-dependencies]
criterion = "0.3"

[[bench]]
name = "monitor"
harness = false
