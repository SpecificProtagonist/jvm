[package]
name = "jvm"
version = "0.1.0"
authors = ["SpecificProtagonist <specificprotagonist@posteo.net>"]
edition = "2021"

[lib]
bench = false

[dependencies]
# AccessFlags
bitflags = "1.3"
# Storage with JVM lifetime; to be removed later
fixed-typed-arena = "0.2"
# Lookups with borrowed key
hashbrown = "0.14"
# Stack exhaustion check
stacker = "0.1"
cesu8 = "1.1"
# Maybe fully replace this by thread parking?
atomic-wait = "1.1"

# TMP
winapi = "0.3.9"

[target.'cfg(target_os = "windows")'.dependencies.winapi]
version = "0.3.9"

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies.libc]
version = "0.2"

[dev-dependencies]
criterion = "0.3"

[[bench]]
name = "monitor"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(miri_debug_print)'] }
