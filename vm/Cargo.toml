[package]
name = "vm"
version = "0.1.0"
authors = ["SpecificProtagonist <specificprotagonist@posteo.net>"]
edition = "2021"
autobenches = false

[lib]
bench = false

[profile.release]
debug = 1

[dependencies]
# AccessFlags
bitflags = "1.3"
# Storage with JVM lifetime; to be removed later
fixed-typed-arena = "0.2"
# Lookups with borrowed key
hashbrown = "0.14"
# Stack exhaustion check
stacker = "0.1"
cesu8 = "1.1"
# Maybe fully replace this by thread parking?
atomic-wait = "1.1"

[target.'cfg(target_os = "windows")'.dependencies.winapi]
version = "0.3.9"

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies.libc]
version = "0.2"

[target.'cfg(loom)'.dependencies]
loom = { git = "https://github.com/SpecificProtagonist/loom.git", branch = "lock-api-update"}
lock_api = "0.4"
tracing = "0.1"

[dev-dependencies]
criterion = "0.3"

[[bench]]
name = "interpreter"
harness = false

[[bench]]
name = "monitor"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(miri_debug_print)', 'cfg(loom)'] }

[lints.clippy]
std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
